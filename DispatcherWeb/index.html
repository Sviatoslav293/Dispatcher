<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авідиспетчер — система управління</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">✈</div>
          <div class="brand-text">
            <span class="eyebrow">Авіадиспетчер</span>
            <h1>Система автоматизації</h1>
          </div>
        </div>
        <div id="server-status" class="server-status" role="status" aria-live="polite">
          Перевірка зв’язку...
        </div>
      </header>

      <main class="dashboard">
        <aside class="panel flights-panel">
          <div class="panel-header">
            <h2>Рейси</h2>
          </div>
          <div id="flight-tabs" class="flight-tabs" aria-label="Вкладки рейсів">
            <button type="button" class="flight-tab active" data-flight-tab="current">Поточні</button>
            <button type="button" class="flight-tab" data-flight-tab="history">Історія</button>
          </div>
          <ul id="flight-list" class="flight-list"></ul>
        </aside>

        <section class="panel map-panel">
          <div class="panel-header">
            <h2>Карта</h2>
          </div>
          <div id="map" aria-label="Карта польотів"></div>
        </section>

        <aside class="panel telemetry-panel">
          <div class="panel-header">
            <h2>Телеметрія</h2>
          </div>
          <div id="telemetry-details" class="telemetry-details empty-state">
            Виберіть рейс для перегляду.
          </div>
        </aside>
      </main>

      <section class="bottom-row">
        <div class="panel commands-panel">
          <div class="panel-header">
            <h2>Команди</h2>
          </div>
          <form id="command-form" class="command-form">
            <label>
              <span>Тип команди</span>
              <select id="command-type">
                <option value="SetHeading">Зміна курсу</option>
                <option value="SetAltitude">Зміна висоти</option>
                <option value="SetSpeed">Зміна швидкості</option>
              </select>
            </label>

            <label>
              <span>Значення</span>
              <input id="command-value" type="number" step="1" value="90" min="0" />
            </label>

            <button id="command-submit" type="submit">Відправити</button>
          </form>
          <p id="command-message" class="command-message" aria-live="polite"></p>
        </div>

        <div class="panel history-panel">
          <div class="panel-header">
            <h2>Історія команд</h2>
          </div>
          <ul id="command-history" class="command-history"></ul>
        </div>
      </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
